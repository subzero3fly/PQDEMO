<script>
function fmtBal(n) {
  return '$' + (parseFloat(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

auth.onAuthStateChanged(async function(user) {
  if (!user) { window.location.href = 'login.html'; return; }
  predictionEngine.start();

  try {
    var snap = await db.collection('users').doc(user.uid).get();

    // Recovery: if doc missing, recreate it
    if (!snap.exists) {
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', rand = '';
      for (var i=0;i<8;i++) rand += chars[Math.floor(Math.random()*chars.length)];
      await db.collection('users').doc(user.uid).set({
        fullName: user.displayName || user.email.split('@')[0] || 'User',
        email: user.email||'', phone:'', accountId:'PIQ-'+rand, balance:0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      snap = await db.collection('users').doc(user.uid).get();
    }

    var ud = snap.data() || {};
    var bal = fmtBal(ud.balance);
    var initials = (ud.fullName||'U').split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
    if (typeof smartsupp === 'function') { smartsupp('name', ud.fullName||'User'); smartsupp('email', ud.email||''); }

    // Header balance-pair .b-value spans
    var bvals = document.querySelectorAll('.balance-pair .b-value');
    bvals.forEach(function(el){ el.textContent = bal; });

    // Tab bar portfolio link — contains the $0.00 text node
    document.querySelectorAll('.tab-bar a').forEach(function(a){
      if (a.getAttribute('href') === 'portfolio.html') {
        // Replace the text node (last child) with real balance
        var nodes = a.childNodes;
        for (var i = nodes.length-1; i >= 0; i--) {
          if (nodes[i].nodeType === 3 && nodes[i].textContent.trim()) {
            nodes[i].textContent = '
    ' + bal + '
  ';
            break;
          }
        }
      }
    });

    // Avatar initials
    var av = document.querySelector('.profile-menu .avatar, #headerAvatar');
    if (av) av.textContent = initials;

    // Profile panel name and account ID
    var pname = document.querySelector('#panelName');
    var paddr = document.querySelector('#panelAccountId, .profile-panel .addr');
    if (pname) pname.textContent = ud.fullName || 'User';
    if (paddr) paddr.textContent = ud.accountId || '';

    // Logout button
    });
    });
  } catch(e) {
    console.warn('Auth balance error:', e);
    window.location.href = 'login.html';
  }
});
</script>


<script>
// ── Search page market logic ───────────────────────────────────────────────
var allMarkets  = [];
var currentSort = 'new';
var searchTimer = null;

var CAT_ICONS_PATHS = {
  politics:    '<path d="M3 21h18M5 21V7l7-5 7 5v14" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  sports:      '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 3a14.5 14.5 0 0 0 0 18M3 12h18" stroke="currentColor" stroke-width="1.4"/>',
  esports:     '<rect x="2" y="6" width="20" height="12" rx="3" stroke="currentColor" stroke-width="1.6"/>',
  finance:     '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  geopolitics: '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M15 9l-2 6-6 2 2-6 6-2Z" stroke="currentColor" stroke-width="1.4"/>',
  tech:        '<rect x="2" y="4" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/>',
  culture:     '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>',
  economy:     '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17" stroke="currentColor" stroke-width="1.6"/>',
  crypto:      '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 8.5h3a2 2 0 1 1 0 4h-4a2 2 0 1 0 0 4h3.5M12 6v12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>'
};
var DEFAULT_ICON_PATH = '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>';

function volFmt(v) {
  v = parseFloat(v)||0;
  if (v>=1e9) return '$'+(v/1e9).toFixed(1)+'B';
  if (v>=1e6) return '$'+(v/1e6).toFixed(1)+'M';
  if (v>=1000) return '$'+(v/1000).toFixed(0)+'K';
  return '$'+v.toFixed(0);
}

function buildCard(m) {
  var id   = m.id;
  var prob = Math.round(m.currentProbability || m.startingProbability || 50);
  var no   = 100 - prob;
  var vol  = volFmt(m.totalVolume||0);
  var cat  = m.category||'general';
  var icon = CAT_ICONS_PATHS[cat] || DEFAULT_ICON_PATH;
  var url  = 'market-detail.html?id=' + id;
  var isBinary = m.marketType === 'binary' || !m.outcomes || m.outcomes.length <= 2;
  var inner = '<div class="m-card-head">';
  inner += '<span class="m-card-icon"><svg class="icon-sm" viewBox="0 0 24 24" fill="none">' + icon + '</svg></span>';
  inner += '<span class="m-card-title">' + (m.question||'Untitled') + '</span>';
  if (isBinary) {
    inner += '<div style="flex-shrink:0;width:44px;height:44px;background:conic-gradient(var(--yes) calc('+prob+'*1%),var(--border) 0);border-radius:50%;position:relative;">';
    inner += '<span style="position:absolute;inset:7px;background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--text);">'+prob+'%</span></div>';
  }
  inner += '</div>';
  if (isBinary) {
    inner += '<div style="margin:10px 0 8px;"><div style="height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:5px;"><div style="height:100%;width:'+prob+'%;background:var(--yes);border-radius:99px;"></div></div>';
    inner += '<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;"><span style="color:var(--yes);">YES '+prob+'%</span><span style="color:var(--no);">NO '+no+'%</span></div></div>';
    inner += '<div class="m-card-actions"><button class="chip chip-yes" onclick="event.preventDefault();location.href=\''+url+'&side=YES\'">Yes</button><button class="chip chip-no" onclick="event.preventDefault();location.href=\''+url+'&side=NO\'">No</button></div>';
  } else {
    inner += '<div class="outcome-list">';
    (m.outcomes||[]).slice(0,3).forEach(function(o){
      inner += '<div class="outcome-row"><span class="outcome-name">'+(o.name||'')+'</span><span class="outcome-pct">'+(o.probability||0)+'%</span>';
      inner += '<span class="chip-row"><span class="chip chip-yes" style="cursor:pointer;" onclick="event.preventDefault();location.href=\''+url+'\'">Yes</span>';
      inner += '<span class="chip chip-no" style="cursor:pointer;" onclick="event.preventDefault();location.href=\''+url+'\'">No</span></span></div>';
    });
    inner += '</div>';
  }
  inner += '<div class="m-card-foot"><span class="vol"><b>'+vol+'</b> Vol.</span></div>';
  return '<article class="m-card" style="cursor:pointer;" onclick="location.href=\''+url+'\'">' + inner + '</article>';
}

function sortMarkets(list, sort) {
  var copy = list.slice();
  if (sort === 'new') {
    copy.sort(function(a,b){ return ((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0); });
  } else if (sort === 'popular' || sort === 'liquid' || sort === 'trending') {
    copy.sort(function(a,b){ return (b.totalVolume||0)-(a.totalVolume||0); });
  } else if (sort === 'ending') {
    copy.sort(function(a,b){
      var at = (a.resolutionDate&&a.resolutionDate.seconds)||Infinity;
      var bt = (b.resolutionDate&&b.resolutionDate.seconds)||Infinity;
      return at-bt;
    });
  } else if (sort === 'competitive') {
    copy.sort(function(a,b){
      return Math.abs(50-(a.currentProbability||50)) - Math.abs(50-(b.currentProbability||50));
    });
  }
  return copy;
}

function renderResults(list, label) {
  var grid  = document.getElementById('searchResultsGrid');
  var noRes = document.getElementById('searchNoResults');
  var lbl   = document.getElementById('searchResultsLabel');
  if (lbl) lbl.textContent = label || 'Results';
  if (!list.length) { grid.innerHTML=''; noRes.style.display='block'; return; }
  noRes.style.display = 'none';
  grid.innerHTML = list.map(buildCard).join('');
}

function onSearchInput(val) {
  var wrap   = document.getElementById('searchResultsWrap');
  var browse = document.getElementById('browseWrap');
  val = val.trim().toLowerCase();
  if (!val) { wrap.style.display='none'; browse.style.display='block'; return; }
  wrap.style.display   = 'block';
  browse.style.display = 'none';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    var matches = allMarkets.filter(function(m){
      return (m.question||'').toLowerCase().indexOf(val)>=0 ||
             (m.category||'').toLowerCase().indexOf(val)>=0 ||
             (m.tags||[]).some(function(t){ return t.toLowerCase().indexOf(val)>=0; });
    });
    renderResults(sortMarkets(matches, currentSort), 'Results for "'+val.slice(0,30)+'"');
  }, 280);
}

function setBrowse(e, btn) {
  e.preventDefault();
  currentSort = btn.dataset.sort || 'new';
  document.querySelectorAll('.browse-chip').forEach(function(c){ c.classList.remove('is-active'); });
  btn.classList.add('is-active');
  var val = (document.getElementById('searchInput').value||'').trim().toLowerCase();
  var list = val ? allMarkets.filter(function(m){
    return (m.question||'').toLowerCase().indexOf(val)>=0 ||
           (m.category||'').toLowerCase().indexOf(val)>=0;
  }) : allMarkets;
  document.getElementById('searchResultsWrap').style.display = 'block';
  document.getElementById('browseWrap').style.display        = 'none';
  renderResults(sortMarkets(list, currentSort), (btn.textContent||'').trim()+' Markets');
}

function goTopic(e, cat) {
  e.preventDefault();
  var matches = allMarkets.filter(function(m){ return m.category===cat; });
  document.getElementById('searchResultsWrap').style.display = 'block';
  document.getElementById('browseWrap').style.display        = 'none';
  document.getElementById('searchInput').value = cat.charAt(0).toUpperCase()+cat.slice(1);
  renderResults(sortMarkets(matches, currentSort), cat.charAt(0).toUpperCase()+cat.slice(1)+' Markets');
}

// Load markets once on page load
db.collection('markets').where('status','==','active').get().then(function(snap){
  allMarkets = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
}).catch(function(e){ console.warn('Search load error:',e); });
</script>

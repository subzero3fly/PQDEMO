<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>PredictIQ — Sign In</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); padding:20px; }
    .auth-card { width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px 28px; }
    .auth-brand { display:flex; align-items:center; gap:9px; margin-bottom:28px; }
    .auth-brand svg { width:28px; height:28px; color:var(--accent); }
    .auth-title { font-family:var(--font-display); font-size:22px; font-weight:800; margin-bottom:6px; color:var(--text); }
    .auth-sub   { font-size:13.5px; color:var(--text-dim); margin-bottom:24px; }
    .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .form-label { font-size:13px; font-weight:600; color:var(--text-dim); }
    .form-input { height:44px; padding:0 14px; border-radius:var(--radius-sm); background:var(--bg); border:1.5px solid var(--border); color:var(--text); font-size:15px; font-family:inherit; transition:border-color .15s; outline:none; }
    .form-input:focus { border-color:var(--accent); }
    .form-input::placeholder { color:var(--text-dim); opacity:.5; }
    .pass-field { position:relative; }
    .pass-field .form-input { width:100%; padding-right:44px; }
    .pass-toggle { position:absolute; top:0; right:0; width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:none; border:none; cursor:pointer; color:var(--text-dim); padding:0; }
    .pass-toggle:hover { color:var(--text); }
    .pass-toggle svg { width:19px; height:19px; }
    .pass-toggle .eye-off { display:none; }
    .pass-toggle.is-visible .eye-on { display:none; }
    .pass-toggle.is-visible .eye-off { display:block; }
    .form-error { font-size:12.5px; color:#f2496b; margin-top:2px; display:none; }
    .form-error.show { display:block; }
    .btn-submit { width:100%; height:46px; border-radius:var(--radius-pill); background:var(--accent); color:#fff; font-size:15px; font-weight:700; border:none; cursor:pointer; margin-top:8px; font-family:inherit; transition:opacity .15s; }
    .btn-submit:hover { opacity:.88; }
    .btn-submit:disabled { opacity:.5; cursor:not-allowed; }
    .auth-footer { text-align:center; font-size:13.5px; color:var(--text-dim); margin-top:20px; }
    .auth-footer a { color:var(--accent); font-weight:600; text-decoration:none; }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="auth-brand">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor">
      <path d="M16 2 28 9v14L16 30 4 23V9Z" stroke-width="2" stroke-linejoin="round"/>
      <path d="M9 18l4.5-6 4 4L23 10" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="23" cy="10" r="1.8" fill="currentColor" stroke="none"/>
    </svg>
    <span style="font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--text);">Predict<span style="color:var(--accent);">IQ</span></span>
  </div>

  <div class="auth-title">Welcome back</div>
  <div class="auth-sub">Sign in to your account to continue forecasting.</div>

  <div id="globalErr" class="form-error"></div>

  <div class="form-group">
    <label class="form-label" for="loginEmail">Email address</label>
    <input class="form-input" id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email"/>
  </div>
  <div class="form-group">
    <label class="form-label" for="loginPassword">Password</label>
    <div class="pass-field">
      <input class="form-input" id="loginPassword" type="password" placeholder="Enter your password" autocomplete="current-password"/>
      <button type="button" class="pass-toggle" id="loginPassToggle" onclick="togglePass('loginPassword','loginPassToggle')" aria-label="Show password" tabindex="-1">
        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 4.22-5.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
      </button>
    </div>
  </div>

  <button class="btn-submit" id="loginBtn" onclick="doLogin()">Sign In</button>
  <div class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
function togglePass(inputId, btnId) {
  var input = document.getElementById(inputId);
  var btn   = document.getElementById(btnId);
  var show  = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.classList.toggle('is-visible', show);
  btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
}

// If already signed in, redirect
auth.onAuthStateChanged(async function(user) {
  if (!user) return;
  try {
    var adminSnap = await db.collection('admins').doc(user.uid).get();
    if (adminSnap.exists) { location.href = 'admin.html'; return; }
    var userSnap = await db.collection('users').doc(user.uid).get();
    if (userSnap.exists) { location.href = 'index.html'; }
  } catch(e) {}
});

function generateAccountId() {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var rand  = '';
  for (var i = 0; i < 8; i++) rand += chars[Math.floor(Math.random() * chars.length)];
  return 'PIQ-' + rand;
}

async function doLogin() {
  var email  = document.getElementById('loginEmail').value.trim();
  var pass   = document.getElementById('loginPassword').value;
  var errEl  = document.getElementById('globalErr');
  var btn    = document.getElementById('loginBtn');
  errEl.className = 'form-error';

  if (!email || !pass) {
    errEl.textContent = 'Please fill in all fields.';
    errEl.className   = 'form-error show'; return;
  }

  btn.disabled    = true;
  btn.textContent = 'Signing in…';

  try {
    var cred = await auth.signInWithEmailAndPassword(email, pass);
    var uid  = cred.user.uid;

    // Check admin first
    var adminSnap = await db.collection('admins').doc(uid).get();
    if (adminSnap.exists) { location.href = 'admin.html'; return; }

    // Check for user doc
    var userSnap = await db.collection('users').doc(uid).get();

    if (!userSnap.exists) {
      // ── RECOVERY: Auth account exists but Firestore doc is missing ──────────
      // This happens when signup created the Auth user but the Firestore write
      // failed (e.g. rules not published yet). Recreate the doc now.
      var accountId = generateAccountId();
      await db.collection('users').doc(uid).set({
        fullName:  cred.user.displayName || email.split('@')[0] || 'User',
        email:     cred.user.email || email,
        phone:     '',
        accountId: accountId,
        balance:   0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    location.href = 'index.html';

  } catch(e) {
    btn.disabled    = false;
    btn.textContent = 'Sign In';

    var msg = 'Invalid email or password.';
    if (e.code === 'auth/user-not-found' ||
        e.code === 'auth/wrong-password'  ||
        e.code === 'auth/invalid-credential') {
      msg = 'Invalid email or password.';
    } else if (e.code === 'auth/too-many-requests') {
      msg = 'Too many attempts. Please wait a moment and try again.';
    } else if (e.message && e.message.includes('permissions')) {
      msg = 'Login error — please publish your Firestore rules and try again.';
    } else {
      msg = e.message || msg;
    }
    errEl.textContent = msg;
    errEl.className   = 'form-error show';
  }
}

document.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
</script>

</body>
</html>
